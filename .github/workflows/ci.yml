name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: requirements.txt matches pyproject.toml
        run: python scripts/check_requirements.py
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Tests (SQLite)
        run: pytest --cov=app --cov-report=term-missing:skip-covered -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  backend-postgres:
    name: Backend on PostgreSQL (migrations + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leadgen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # A non-superuser owner, like production, so row-level security is actually enforced.
      DATABASE_URL: postgresql://leadgen_app:app@localhost:5432/leadgen_app
      TEST_DATABASE_URL: postgresql://leadgen_app:app@localhost:5432/leadgen_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Create the app role and databases
        run: |
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -c "CREATE ROLE leadgen_app LOGIN PASSWORD 'app' NOSUPERUSER"
          psql -h localhost -U postgres -c "CREATE DATABASE leadgen_app OWNER leadgen_app"
          psql -h localhost -U postgres -c "CREATE DATABASE leadgen_test OWNER leadgen_app"
      - name: Migrate to head, check for drift, migrate back down and up again
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests (PostgreSQL)
        run: pytest -q

  api-types:
    name: Generated API types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "services/api"
      - run: npm ci
        working-directory: apps/web
      - name: Regenerate and compare
        working-directory: apps/web
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api/schema.d.ts || {
            echo "::error::API types are stale. Run 'npm run gen:api' in apps/web and commit."
            exit 1
          }

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end smoke test (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -e "services/api"
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run the smoke test (starts the API and a production build)
        working-directory: apps/web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            services/api/e2e-api.log
          retention-days: 7

  docker:
    name: Docker images build and the stack becomes ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the compose stack
        run: docker compose up --build -d
      - name: Wait for readiness (database, Redis, migrations, worker heartbeat)
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready | grep -q '"status":"ready"'; then exit 0; fi
            sleep 5
          done
          docker compose logs api worker beat
          exit 1
      - name: Web app responds
        run: curl -sf http://localhost:3000/healthz
      - if: always()
        run: docker compose down -v
