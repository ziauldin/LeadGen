[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leadsgen-api"
version = "0.1.0"
description = "LeadsGen B2B lead-intelligence and outreach API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.3",
    "tldextract>=5.1.2",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.17",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi,celery,sqlalchemy]>=2.18.0",
    "python-json-logger>=2.0.7",
    "dnspython>=2.7.0",
    "tzdata>=2024.2",
    "boto3>=1.35.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-celery>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.3",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "time-machine>=2.16.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 120
markers = [
    "postgres: tests that need a real PostgreSQL database (set TEST_DATABASE_URL)",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC", "RUF", "PLE"]
ignore = [
    "E501",    # line length is handled by `ruff format`
    "B008",    # FastAPI Depends() in argument defaults is the framework idiom
    "RUF012",  # SQLAlchemy/Pydantic class attributes
    "S311",    # random is not used for security
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S108", "S608"]
"scripts/**" = ["S311"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["alembic/versions/", "tests/"]

[[tool.mypy.overrides]]
module = [
    "app.core.*",
    "app.services.sending.*",
    "app.services.inbound.*",
    "app.services.billing.*",
    "app.services.llm.*",
]
disallow_untyped_defs = true
