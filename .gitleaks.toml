# gitleaks configuration: the default rules plus allowances for clearly-fake local values.
[extend]
useDefault = true

[allowlist]
description = "Local-only and test fixtures"
paths = [
  '''docker-compose\.yml''',
  '''services/api/tests/.*''',
  '''apps/web/src/.*\.test\.tsx?''',
  '''apps/web/e2e/.*''',
  '''apps/web/openapi\.json''',
]
regexes = [
  '''re_test_[A-Za-z0-9]+''',
  '''whsec_c3VwZXItc2VjcmV0''',
]
